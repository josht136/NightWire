name: Nightwire
options:
  bundleIdPrefix: com.nightwire
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Release
settings:
  base:
    MARKETING_VERSION: 1.0.1
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    COMBINE_HIDPI_IMAGES: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Nightwire:
    type: application
    platform: macOS
    sources:
      - path: Nightwire
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: Nightwire
        PRODUCT_BUNDLE_IDENTIFIER: com.nightwire.app
        INFOPLIST_FILE: Nightwire/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Nightwire
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_LSMinimumSystemVersion: 14.0
        CODE_SIGN_ENTITLEMENTS: Nightwire/Nightwire.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - sdk: CoreWLAN.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      - sdk: ServiceManagement.framework
      - sdk: UserNotifications.framework
    entitlements:
      path: Nightwire/Nightwire.entitlements
    scheme:
      testTargets: []
