name: Nightwire
options:
  bundleIdPrefix: com.nightwire
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Release
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CLANG_C_LANGUAGE_STANDARD: gnu11
targets:
  Nightwire:
    type: application
    platform: iOS
    sources:
      - path: Nightwire
        excludes:
          - Info.plist
          - Nightwire.entitlements
          - Nightwire-Bridging-Header.h
    settings:
      base:
        PRODUCT_NAME: Nightwire
        PRODUCT_BUNDLE_IDENTIFIER: com.nightwire.ios
        INFOPLIST_FILE: Nightwire/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Nightwire/Nightwire.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Nightwire/Nightwire-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["$(inherited)", "-lresolv"]
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    dependencies:
      - sdk: Network.framework
      - sdk: NetworkExtension.framework
      - sdk: CoreLocation.framework
    entitlements:
      path: Nightwire/Nightwire.entitlements
    scheme:
      testTargets:
        - NightwireTests
  NightwireTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NightwireTests
    dependencies:
      - target: Nightwire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightwire.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nightwire.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Nightwire"
        BUNDLE_LOADER: "$(TEST_HOST)"
    scheme: {}
